services:
  web:
    build: .
    image: ventalibra-web:latest
    container_name: ventalibra-web
    restart: unless-stopped
    ports:
      - "8085:80"
    networks:
      - stack-net
    depends_on:
      - auth

  auth:
    build: ./auth
    image: ventalibra-web-auth:latest
    container_name: ventalibra-web-auth
    restart: unless-stopped
    environment:
      - DOCS_AUTH_SECRET=${DOCS_AUTH_SECRET:-}
      - DOCS_SESSION_SECRET=${DOCS_SESSION_SECRET:-ventalibra-docs-secret-change-me}
      - APEX_DOMAIN=${APEX_DOMAIN:-ventalibra.com.ar}
    networks:
      - stack-net

networks:
  stack-net:
    external: true
    name: stack_stack-net
