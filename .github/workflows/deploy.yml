name: Deploy a VPS

# Reusable workflow compartido con Contalibra/Restolibra/Gestiolibra/
# MedLibra -- extraído 2026-07-26, ver
# wiki/analyses/auditoria-duplicacion-familia-libra.md (P3, continuación).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    uses: marianocappucci/libra-web-kit/.github/workflows/deploy-vps.yml@main
    with:
      remote_path: /root/ventalibra_web/
    secrets: inherit
